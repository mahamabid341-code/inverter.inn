<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>invert.inn - VIP Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbar for better App look */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden selection:bg-indigo-100">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] space-y-2 w-[90%] max-w-sm"></div>

  <!-- FLOATING ADD BUTTON FOR MOBILE -->
  <button onclick="window.openForm()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-[0_10px_25px_-5px_rgba(79,70,229,0.5)] flex items-center justify-center text-2xl z-40 transition-transform active:scale-95">
    <i class="fa-solid fa-plus"></i>
  </button>

  <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between p-6 shadow-xl z-20 relative">
    <div class="space-y-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-2xl font-black text-sm">i.i</div>
        <h1 class="text-white font-black text-base tracking-tight">invert<span class="text-indigo-500">.inn</span></h1>
      </div>
      <nav class="space-y-1.5 text-xs font-semibold">
        <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="index.html" target="_blank" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-800 transition text-slate-400 hover:text-white"><i class="fa-solid fa-store"></i> View Live Store</a>
      </nav>
    </div>
    <div class="text-[10px] text-slate-500 font-medium">Admin Panel v9.0 VIP</div>
  </aside>

  <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
    <header class="bg-white/80 backdrop-blur-md border-b px-4 sm:px-8 py-4 flex justify-between items-center shadow-sm sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <h2 class="text-sm sm:text-base font-black text-slate-900">VIP Dashboard</h2>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="window.openForm()" class="hidden md:flex bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Product
        </button>
        <a href="index.html" target="_blank" class="md:hidden text-[10px] font-bold bg-slate-100 text-slate-600 px-3 py-2 rounded-xl border hover:bg-slate-200 transition"><i class="fa-solid fa-store"></i> Store</a>
        <span class="text-[10px] sm:text-xs font-bold bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full border border-indigo-100 hidden sm:inline-block">Admin Mode</span>
      </div>
    </header>

    <div class="p-4 sm:p-8 space-y-6 sm:space-y-8 max-w-7xl w-full mx-auto pb-24">
      
      <!-- STATS -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-6">
        <div class="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
          <div>
            <p class="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Total Products</p>
            <h3 id="totalCount" class="text-xl sm:text-2xl font-black text-slate-900 mt-1">0</h3>
          </div>
          <div class="bg-indigo-50 text-indigo-600 p-2.5 sm:p-4 rounded-xl"><i class="fa-solid fa-box text-sm sm:text-lg"></i></div>
        </div>
        <div class="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
          <div>
            <p class="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Categories</p>
            <h3 class="text-xl sm:text-2xl font-black text-slate-900 mt-1">3</h3>
          </div>
          <div class="bg-emerald-50 text-emerald-600 p-2.5 sm:p-4 rounded-xl"><i class="fa-solid fa-tags text-sm sm:text-lg"></i></div>
        </div>
        <div class="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm col-span-2 sm:col-span-1 flex flex-row items-center justify-between">
          <div>
            <p class="text-[9px] sm:text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">System Status</p>
            <h3 class="text-sm sm:text-lg font-black text-emerald-600 mt-1">Live Database</h3>
          </div>
          <div class="bg-amber-50 text-amber-600 p-2.5 sm:p-4 rounded-xl"><i class="fa-solid fa-bolt text-sm sm:text-lg"></i></div>
        </div>
      </div>

      <!-- INVENTORY SECTION WITH CHIPS -->
      <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 sm:p-6 border-b bg-white space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-black text-sm sm:text-base text-slate-900">Database History</h3>
            <button id="bulkDeleteBtn" onclick="window.deleteSelected()" class="hidden bg-rose-600 hover:bg-rose-700 text-white px-3 sm:px-4 py-2 rounded-xl text-[10px] sm:text-xs font-bold shadow-md transition">
              <i class="fa-solid fa-trash-can mr-1.5"></i> Delete (<span id="selectedCount">0</span>)
            </button>
          </div>
          
          <!-- APP STYLE CHIPS FILTER -->
          <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
            <button onclick="window.filterTable('All')" class="chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white transition shrink-0 shadow-sm">All Products</button>
            <button onclick="window.filterTable('VFD Drives')" class="chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">VFD Drives</button>
            <button onclick="window.filterTable('Solar Inverters')" class="chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">Solar Inverters</button>
            <button onclick="window.filterTable('Servo Motors')" class="chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0">Servo Motors</button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left whitespace-nowrap">
            <thead class="bg-slate-50 text-[10px] uppercase text-slate-400 font-bold border-b">
              <tr>
                <th class="p-3 sm:p-4 w-10"><input type="checkbox" id="selectAll" onclick="window.toggleSelectAll(this)" class="rounded accent-indigo-600 cursor-pointer w-4 h-4"></th>
                <th class="p-3 sm:p-4">Product Info</th>
                <th class="p-3 sm:p-4">Category</th>
                <th class="p-3 sm:p-4">Price</th>
                <th class="p-3 sm:p-4">Actions</th>
              </tr>
            </thead>
            <tbody id="adminTable">
              <tr><td colspan="5" class="p-8 text-xs text-slate-400 text-center"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading inventory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- SCREEN POPUP (MODAL) FOR ADD/EDIT -->
  <div id="formModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 hidden transition-opacity opacity-0 duration-300">
    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl relative flex flex-col max-h-[90vh] overflow-hidden transform scale-95 transition-transform duration-300" id="formModalContent">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
        <h3 id="formTitle" class="font-black text-sm sm:text-base text-slate-900">Add New Product</h3>
        <button onclick="window.closeForm()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-6 overflow-y-auto flex-1 space-y-4 bg-white">
        <input type="hidden" id="editId">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Model Name</label>
            <input id="pTitle" placeholder="e.g. Yaskawa VFD" class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Brand Name</label>
            <input id="pBrand" placeholder="e.g. Yaskawa" class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Category</label>
            <select id="pCategory" class="border p-3 rounded-xl text-xs bg-slate-50 text-slate-700 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
              <option value="">Select Category</option>
              <option value="VFD Drives">VFD Drives</option>
              <option value="Solar Inverters">Solar Inverters</option>
              <option value="Servo Motors">Servo Motors & Drives</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Price (PKR)</label>
            <input id="pPrice" type="number" placeholder="e.g. 25000" class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Power Rating</label>
            <input id="pPower" placeholder="e.g. 3 HP / 2.2 kW" class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Video Link (TikTok/YT)</label>
            <input id="pVideo" placeholder="https://..." class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase">Multiple Image Links (Comma separated)</label>
            <textarea id="pImage" rows="2" placeholder="https://i.ibb.co/..., https://i.ibb.co/..." class="border p-3 rounded-xl text-xs bg-slate-50 w-full outline-none focus:ring-2 focus:ring-indigo-600/20 focus:bg-white transition resize-none"></textarea>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t bg-slate-50 flex gap-3">
        <button id="saveBtn" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition">Save Product</button>
        <button onclick="window.closeForm()" class="px-6 py-3 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm">Cancel</button>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
      apiKey: "AIzaSyBj7CKrC_Hax4t8MdusrhIEMql2c5zn53I",
      authDomain: "servo-motor-3cf41.firebaseapp.com",
      projectId: "servo-motor-3cf41",
      storageBucket: "servo-motor-3cf41.firebasestorage.app",
      messagingSenderId: "207233803842",
      appId: "1:207233803842:web:4d7d728ac7e31cc230afdb"
    }));

    const fallbackImg = "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500";
    let allProductsData = [];

    // --- TOAST UI ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `flex items-center gap-3 px-4 py-3.5 rounded-2xl shadow-2xl text-xs font-bold text-white transition-all duration-300 transform translate-y-[-20px] opacity-0 ${type === 'success' ? 'bg-slate-800' : 'bg-rose-600'}`;
      toast.innerHTML = `<div class="${type === 'success' ? 'text-emerald-400' : 'text-white'}"><i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i></div> <div>${message}</div>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-[-20px]', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- MODAL CONTROLS ---
    const modal = document.getElementById('formModal');
    const modalContent = document.getElementById('formModalContent');

    window.openForm = () => {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
      }, 10);
    };

    window.closeForm = () => {
      modal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        resetForm();
      }, 300);
    };

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('pTitle').value = '';
      document.getElementById('pBrand').value = '';
      document.getElementById('pCategory').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pPower').value = '';
      document.getElementById('pVideo').value = '';
      document.getElementById('pImage').value = '';
      document.getElementById('saveBtn').innerText = "Save Product";
      document.getElementById('formTitle').innerText = "Add New Product";
    }

    // --- DATABASE OPERATIONS ---
    async function saveVDF() {
      const id = document.getElementById('editId').value;
      const imgInput = document.getElementById('pImage').value.trim();
      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      const data = {
        title: document.getElementById('pTitle').value.trim(),
        brand: document.getElementById('pBrand').value.trim(),
        category: document.getElementById('pCategory').value,
        price: Number(document.getElementById('pPrice').value),
        power: document.getElementById('pPower').value.trim(),
        videoUrl: document.getElementById('pVideo').value.trim(),
        images: imgInput || fallbackImg,
        image: imgInput ? imgInput.split(',')[0].trim() : fallbackImg,
        createdAt: id ? undefined : formattedDate
      };

      if(!data.title || !data.price) { 
        showToast("Model Name aur Price lazmi likhein!", "error"); 
        return; 
      }
      
      const btn = document.getElementById('saveBtn');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;
      
      try {
        if(id) { 
          await updateDoc(doc(db, "products", id), data); 
          showToast("Product Updated Successfully!");
        } else { 
          await addDoc(collection(db, "products"), data); 
          showToast("Product Added Successfully!");
        }
        window.closeForm();
        loadDashboard();
      } catch (err) {
        showToast("Error: " + err.message, "error");
      } finally {
        btn.innerHTML = "Save Product";
      }
    }

    async function loadDashboard() {
      try {
        const snap = await getDocs(collection(db, "products"));
        allProductsData = [];
        document.getElementById('totalCount').innerText = snap.size;
        
        snap.forEach(d => {
          allProductsData.push({ id: d.id, ...d.data() });
        });
        
        renderAdminTable(allProductsData);
      } catch (err) {
        console.error(err);
      }
    }

    function renderAdminTable(data) {
      const table = document.getElementById('adminTable');
      table.innerHTML = '';
      
      if(data.length === 0) { 
        table.innerHTML = `<tr><td colspan="5" class="p-8 text-xs text-slate-400 text-center">No products found.</td></tr>`; 
        return; 
      }
      
      data.forEach(p => {
        let firstImg = fallbackImg;
        if(p.image && p.image.startsWith('http')) firstImg = p.image;
        else if(p.images && p.images.split(',')[0].trim().startsWith('http')) firstImg = p.images.split(',')[0].trim();
        
        table.innerHTML += `
          <tr class="border-t text-xs hover:bg-slate-50 transition group">
            <td class="p-3 sm:p-4"><input type="checkbox" value="${p.id}" onchange="window.updateBulkButton()" class="row-checkbox rounded accent-indigo-600 cursor-pointer w-4 h-4"></td>
            <td class="p-3 sm:p-4 flex items-center gap-3">
              <img src="${firstImg}" onerror="this.src='${fallbackImg}'" class="w-12 h-12 object-cover rounded-xl border shadow-sm">
              <div>
                <div class="font-black text-slate-900 text-sm">${p.title || 'Untitled'}</div>
                <div class="text-[10px] text-slate-500 font-bold uppercase mt-0.5">${p.brand || 'No Brand'} ${p.power ? '• '+p.power : ''}</div>
              </div>
            </td>
            <td class="p-3 sm:p-4"><span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md text-[10px] font-bold">${p.category || 'General'}</span></td>
            <td class="p-3 sm:p-4 font-mono font-black text-indigo-600">Rs. ${Number(p.price || 0).toLocaleString()}</td>
            <td class="p-3 sm:p-4">
              <div class="flex gap-2">
                <button onclick="window.editMode('${p.id}')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 w-8 h-8 rounded-lg flex items-center justify-center transition"><i class="fa-solid fa-pen"></i></button>
                <button onclick="window.removeVDF('${p.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 w-8 h-8 rounded-lg flex items-center justify-center transition"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>`;
      });
    }

    // --- CHIPS FILTERING ---
    window.filterTable = (cat) => {
      // Update Chips Style
      document.querySelectorAll('.chip-btn').forEach(btn => {
        if(btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'All Products')) {
          btn.className = "chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white transition shrink-0 shadow-sm";
        } else {
          btn.className = "chip-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition shrink-0";
        }
      });
      
      // Filter Data
      if(cat === 'All') renderAdminTable(allProductsData);
      else renderAdminTable(allProductsData.filter(p => p.category === cat || (cat === 'Servo Motors' && p.category && p.category.includes('Servo'))));
    };

    // --- BULK OPERATIONS ---
    window.toggleSelectAll = (master) => {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = master.checked);
      window.updateBulkButton();
    };

    window.updateBulkButton = () => {
      const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
      const bulkBtn = document.getElementById('bulkDeleteBtn');
      document.getElementById('selectedCount').innerText = checkedCount;
      if(checkedCount > 0) bulkBtn.classList.remove('hidden');
      else bulkBtn.classList.add('hidden');
    };

    window.deleteSelected = async () => {
      const selected = document.querySelectorAll('.row-checkbox:checked');
      if(selected.length === 0) return;
      if(confirm(`Kya aap waqai select kiye gaye ${selected.length} products delete karna chahti hain?`)) {
        try {
          for(let cb of selected) await deleteDoc(doc(db, "products", cb.value));
          showToast("Selected products deleted!");
          loadDashboard();
          document.getElementById('bulkDeleteBtn').classList.add('hidden');
          document.getElementById('selectAll').checked = false;
        } catch(e) { showToast("Error: " + e.message, "error"); }
      }
    };

    // --- INDIVIDUAL ACTIONS ---
    window.editMode = (id) => {
      const p = allProductsData.find(item => item.id === id);
      if(p) {
        document.getElementById('editId').value = id;
        document.getElementById('pTitle').value = p.title || '';
        document.getElementById('pBrand').value = p.brand || '';
        document.getElementById('pCategory').value = p.category || '';
        document.getElementById('pPrice').value = p.price || '';
        document.getElementById('pPower').value = p.power || '';
        document.getElementById('pVideo').value = p.videoUrl || '';
        document.getElementById('pImage').value = p.images || p.image || '';
        document.getElementById('saveBtn').innerText = "Update Product";
        document.getElementById('formTitle').innerText = "Edit Product";
        window.openForm();
      }
    };

    window.removeVDF = async (id) => { 
      if(confirm("Kya aap waqai is product ko delete karna chahti hain?")) { 
        try {
          await deleteDoc(doc(db, "products", id));
          showToast("Product deleted!");
          loadDashboard();
        } catch(e) { showToast("Error: " + e.message, "error"); }
      } 
    }

    document.getElementById('saveBtn').addEventListener('click', saveVDF);
    loadDashboard();
  </script>
</body>
</html>
